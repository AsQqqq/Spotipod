[package]
name = "spotipod-gui"
description = "iPod Classic UI for spotipod-core (webview)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "spotipod-gui"
path = "src/main.rs"

[dependencies]
spotipod-core.workspace = true
tokio.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json = "1"
tao = "0.37"
wry = "0.57"

[build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSAttributedString", "NSColor", "NSFont", "NSParagraphStyle", "NSText"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSDictionary", "NSAttributedString"] }
