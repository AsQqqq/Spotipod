<script>
'use strict';
// iPod OS: navigation and screens live here; data and playback come from Rust
// (ipod.receive) and commands go back over window.ipc.

const ROWS = 6;            // menu rows on screen
const PREFETCH = 150;      // ask for the next batch when this many loaded tracks remain below
const STEP_DEG = 15;       // wheel rotation per step
const VOLUME_STEP = 2;     // percent per wheel step
const MODE_TIMEOUT = 3000; // volume / scrubbing bar falls back to the progress bar
const HOLD_REMOTE = 1500;  // ignore remote volume / position this long after a local change

const BACKLIGHT_SECONDS = { off: 0, sec1: 1, sec2: 2, sec3: 3, sec5: 5, always_on: -1 };
const BACKLIGHT_LABELS = [
    ['off', 'Off'], ['sec1', '1 Second'], ['sec2', '2 Seconds'],
    ['sec3', '3 Seconds'], ['sec5', '5 Seconds'], ['always_on', 'Always On'],
];
// --- Appearance (Settings > Appearance) ---
const THEME_MODE_LABELS = [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']];
const SHELL_LABELS = [['silver', 'Silver'], ['black', 'Black'], ['blue', 'Blue'], ['pink', 'Pink'], ['green', 'Green'], ['gold', 'Gold']];
const SCREEN_LABELS = [['classic', 'Classic'], ['blue', 'Blue'], ['amber', 'Amber'], ['green', 'Green']];
const ACCENT_LABELS = [['graphite', 'Graphite'], ['blue', 'Blue'], ['red', 'Red'], ['green', 'Green'], ['pink', 'Pink'], ['orange', 'Orange']];
const labelOf = (arr, v) => { const row = arr.find(([k]) => k === v); return row ? row[1] : cap(v); };
// Mirrors S.settings appearance onto <html data-*> so the CSS presets apply.
function applyTheme() {
    const s = S.settings || {};
    const el = document.documentElement;
    el.dataset.mode = s.theme_mode || 'auto';
    el.dataset.shell = s.shell || 'silver';
    el.dataset.screen = s.screen || 'classic';
    el.dataset.accent = s.accent || 'graphite';
}
const PLAY_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="20" viewBox="0 0 17 20"><path d="M71.234-28.693 10.883 7.049v-71.533z" transform="translate(-3.043 18.03)scale(.27959)"></path></svg>';
const PAUSE_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="20" viewBox="0 0 17 20"><path d="M2 1h5v18H2zM10 1h5v18h-5z"></path></svg>';

// --- State from Rust ---

    phase: 'starting',
    progress: '',
    status: '',
    update: { current_version: '', version: null, available: false, status: 'checking', message: null },
    ui_scale: 1,
    settings: { shuffle: 'off', repeat: 'off', backlight: 'off', clicker: true, clicker_volume: 100, theme_mode: 'auto', shell: 'silver', screen: 'classic', accent: 'graphite' },
    about: null,
    outputs: [],
    playback: { status: 'stopped', track: null, position_ms: 0, volume: 0, device: null },
    playlists: [],
    albums: [],
    liked: null,
};
const lists = {};          // context -> { name, total, tracks, done, requested }
let receivedAt = performance.now();

// --- UI state ---
let stack = [];            // [{ id, sel, top }]
let view = 'menu';         // 'menu' | 'now_playing' | 'brick' | 'calendar' | 'alarm_ring'
let npMode = 'progress';   // 'progress' | 'volume' | 'scrubbing'
let npModeTimer = null;
let playedFrom = null;     // context of the last track started here
let localVolume = null, localVolumeAt = -Infinity;
let scrubMs = null, scrubSentAt = -Infinity, scrubTimer = null;
let toastTimer = null, toast = '';

const $ = id => document.getElementById(id);
const send = msg => window.ipc && window.ipc.postMessage(JSON.stringify(msg));
const brickCanvas = $('brick-canvas');
const brickCtx = brickCanvas.getContext('2d');
const calendarCanvas = $('calendar-canvas');
const calendarCtx = calendarCanvas.getContext('2d');
const BRICK_PADDLE_STEP = 12;
const ALARM_STORAGE_KEY = 'spotipod-alarm';
const DEFAULT_ALARM = { enabled: false, hour: 7, minute: 0, daily: true };
const calendarDate = new Date();
let alarmSettings = loadAlarmSettings();
let alarmReturnView = 'menu';
let alarmPausedBrick = false;
let alarmTone = null;
let alarmToneGain = null;
let alarmToneStarted = false;
let alarmToneTimer = null;
let lastAlarmDate = '';
const brickGame = {
    state: 'ready',
    paddleX: brickCanvas.width / 2,
    ballX: brickCanvas.width / 2,
    ballY: brickCanvas.height - 25,
    ballVX: 2.2,
    ballVY: -2.6,
    lives: 3,
    score: 0,
    bricks: [],
    frame: 0,
    lastFrame: 0,
};

function loadAlarmSettings() {
    try {
        const saved = JSON.parse(localStorage.getItem(ALARM_STORAGE_KEY));
        if (!saved || typeof saved !== 'object') return { ...DEFAULT_ALARM };
        return {
            enabled: saved.enabled === true,
            hour: Number.isInteger(saved.hour) && saved.hour >= 0 && saved.hour < 24 ? saved.hour : DEFAULT_ALARM.hour,
            minute: Number.isInteger(saved.minute) && saved.minute >= 0 && saved.minute < 60 ? saved.minute : DEFAULT_ALARM.minute,
            daily: saved.daily !== false,
        };
    } catch (error) {
        console.warn('Could not load alarm settings', error);
        return { ...DEFAULT_ALARM };
    }
}

function saveAlarmSettings() {
    try {
        localStorage.setItem(ALARM_STORAGE_KEY, JSON.stringify(alarmSettings));
    } catch (error) {
        console.warn('Could not save alarm settings', error);
    }
}

function updateAlarmSettings(patch) {
    alarmSettings = { ...alarmSettings, ...patch };
    saveAlarmSettings();
    render();
}

function alarmTimeText() {
    return `${String(alarmSettings.hour).padStart(2, '0')}:${String(alarmSettings.minute).padStart(2, '0')}`;
}

function adjustAlarmTime(steps) {
    const field = cur().sel === 0 ? 'hour' : 'minute';
    const limit = field === 'hour' ? 24 : 60;
    const value = (alarmSettings[field] + steps % limit + limit) % limit;
    updateAlarmSettings({ [field]: value });
}

function drawCalendar() {
    const context = calendarCtx;
    const ink = $('screen').classList.contains('backlit') ? '#b5c3d8' : '#484647';
    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();
    const selectedDay = calendarDate.getDate();
    const firstWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const cellWidth = 34;
    const left = (calendarCanvas.width - cellWidth * 7) / 2;

    context.clearRect(0, 0, calendarCanvas.width, calendarCanvas.height);
    context.fillStyle = ink;
    context.textBaseline = 'middle';
    context.textAlign = 'center';
    context.font = 'bold 11px monospace';
    context.fillText(calendarDate.toLocaleString(undefined, { month: 'long', year: 'numeric' }).toUpperCase(), calendarCanvas.width / 2, 12);
    context.font = '8px monospace';
    for (let weekday = 0; weekday < 7; weekday++) {
        context.fillText(['S', 'M', 'T', 'W', 'T', 'F', 'S'][weekday], left + cellWidth * (weekday + 0.5), 31);
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const index = firstWeekday + day - 1;
        const column = index % 7;
        const row = Math.floor(index / 7);
        const x = left + cellWidth * (column + 0.5);
        const y = 49 + row * 17;
        const isSelected = day === selectedDay;
        const isToday = year === today.getFullYear() && month === today.getMonth() && day === today.getDate();
        if (isSelected) {
            context.fillStyle = ink;
            context.fillRect(x - 10, y - 7, 20, 14);
            context.fillStyle = $('screen').classList.contains('backlit') ? '#484647' : '#d6d5d0';
        } else {
            context.fillStyle = ink;
        }
        context.fillText(String(day), x, y);
        if (isToday && !isSelected) context.fillRect(x - 2, y + 6, 4, 1);
    }

    context.fillStyle = ink;
    context.font = '8px monospace';
    context.fillText(calendarDate.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }), calendarCanvas.width / 2, 160);
    context.fillText('WHEEL TO SCROLL', calendarCanvas.width / 2, 174);
}

function openCalendar() {
    calendarDate.setTime(Date.now());
    click(true);
    animateScreenTransition('right');
    view = 'calendar';
    render();
}

function pulseAlarmTone() {
    if (!clickAudioCtx || !alarmToneGain) return;
    const now = clickAudioCtx.currentTime;
    alarmToneGain.gain.cancelScheduledValues(now);
    alarmToneGain.gain.setValueAtTime(0, now);
    for (let pulse = 0; pulse < 3; pulse++) {
        const start = now + pulse * 0.6;
        alarmToneGain.gain.setValueAtTime(0.12, start);
        alarmToneGain.gain.setValueAtTime(0, start + 0.25);
    }
}

function startAlarmTone() {
    if (!clickAudioCtx) return;
    try {
        if (clickAudioCtx.state === 'suspended') clickAudioCtx.resume().catch(error => console.warn('Could not resume alarm audio', error));
        alarmTone = clickAudioCtx.createOscillator();
        alarmToneGain = clickAudioCtx.createGain();
        alarmTone.type = 'square';
        alarmTone.frequency.value = 740;
        alarmToneGain.gain.value = 0;
        alarmTone.connect(alarmToneGain);
        alarmToneGain.connect(clickAudioCtx.destination);
        alarmTone.start();
        alarmToneStarted = true;
        pulseAlarmTone();
        alarmToneTimer = setInterval(pulseAlarmTone, 2200);
    } catch (error) {
        console.warn('Could not start alarm sound', error);
        stopAlarmTone();
    }
}

function stopAlarmTone() {
    clearInterval(alarmToneTimer);
    alarmToneTimer = null;
    if (alarmTone) {
        if (alarmToneStarted) alarmTone.stop();
        alarmTone.disconnect();
        alarmTone = null;
        alarmToneStarted = false;
    }
    if (alarmToneGain) {
        alarmToneGain.disconnect();
        alarmToneGain = null;
    }
}

function showAlarmRing() {
    alarmReturnView = view;
    alarmPausedBrick = view === 'brick' && brickGame.state === 'playing';
    if (alarmPausedBrick) {
        cancelAnimationFrame(brickGame.frame);
        brickGame.frame = 0;
        brickGame.state = 'paused';
    }
    view = 'alarm_ring';
    startAlarmTone();
    render();
}

function dismissAlarm() {
    stopAlarmTone();
    view = alarmReturnView;
    if (view === 'brick' && alarmPausedBrick) resumeBrickGame();
    alarmPausedBrick = false;
    render();
}

function checkAlarm() {
    if (!alarmSettings.enabled || view === 'alarm_ring') return;
    const now = new Date();
    if (now.getHours() !== alarmSettings.hour || now.getMinutes() !== alarmSettings.minute) return;
    const dateKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
    if (lastAlarmDate === dateKey) return;
    lastAlarmDate = dateKey;
    if (!alarmSettings.daily) {
        alarmSettings.enabled = false;
        saveAlarmSettings();
    }
    showAlarmRing();
}

// Splits long info text into screen-wide rows instead of truncating it.
function wrapInfo(text, width = 24, maxLines = 3) {
    const lines = [];
    let line = '';
    for (const word of String(text).split(/\s+/).filter(Boolean)) {
        if (line && (line + ' ' + word).length > width) {
            lines.push(line);
            line = word;
        } else {
            line = line ? line + ' ' + word : word;
        }
    }
    if (line) lines.push(line);
    if (lines.length > maxLines) {
        lines.length = maxLines;
        lines[maxLines - 1] = lines[maxLines - 1].replace(/.?$/, '…');
    }
    return lines;
}

function resetBrickGame() {
    brickGame.state = 'ready';
    brickGame.paddleX = brickCanvas.width / 2;
    brickGame.ballX = brickGame.paddleX;
    brickGame.ballY = brickCanvas.height - 25;
    brickGame.ballVX = 2.2;
    brickGame.ballVY = -2.6;
    brickGame.lives = 3;
    brickGame.score = 0;
    brickGame.bricks = [];
    for (let row = 0; row < 4; row++) {
        for (let column = 0; column < 8; column++) {
            brickGame.bricks.push({
                x: 7 + column * 31,
                y: 22 + row * 12,
                width: 28,
                height: 9,
                row,
                alive: true,
            });
        }
    }
}

function startBrickGame() {
    cancelAnimationFrame(brickGame.frame);
    brickGame.frame = 0;
    resetBrickGame();
    click(true);
    animateScreenTransition('right');
    view = 'brick';
    render();
}

function launchBrickBall() {
    brickGame.state = 'playing';
    brickGame.ballVX = Math.random() < 0.5 ? -2.2 : 2.2;
    brickGame.ballVY = -2.6;
    brickGame.lastFrame = 0;
    brickGame.frame = requestAnimationFrame(updateBrickGame);
}

function resumeBrickGame() {
    brickGame.state = 'playing';
    brickGame.lastFrame = 0;
    brickGame.frame = requestAnimationFrame(updateBrickGame);
}

function selectBrickGame() {
    if (brickGame.state === 'ready') {
        launchBrickBall();
    } else if (brickGame.state === 'playing') {
        brickGame.state = 'paused';
        cancelAnimationFrame(brickGame.frame);
        brickGame.frame = 0;
    } else if (brickGame.state === 'paused') {
        resumeBrickGame();
    } else {
        resetBrickGame();
        launchBrickBall();
    }
    drawBrickGame();
}

function moveBrickPaddle(steps) {
    brickGame.paddleX = Math.max(22, Math.min(brickCanvas.width - 22, brickGame.paddleX + steps * BRICK_PADDLE_STEP));
    if (brickGame.state === 'ready') {
        brickGame.ballX = brickGame.paddleX;
    }
    drawBrickGame();
}

function updateBrickGame(timestamp) {
    if (view !== 'brick' || brickGame.state !== 'playing') return;
    const frameScale = brickGame.lastFrame
        ? Math.min((timestamp - brickGame.lastFrame) / (1000 / 60), 2)
        : 1;
    brickGame.lastFrame = timestamp;

    const radius = 3;
    const paddleY = brickCanvas.height - 15;
    brickGame.ballX += brickGame.ballVX * frameScale;
    brickGame.ballY += brickGame.ballVY * frameScale;

    if (brickGame.ballX < 6 + radius || brickGame.ballX > brickCanvas.width - 6 - radius) {
        brickGame.ballVX *= -1;
        brickGame.ballX = Math.max(6 + radius, Math.min(brickCanvas.width - 6 - radius, brickGame.ballX));
    }
    if (brickGame.ballY < 7 + radius) {
        brickGame.ballVY = Math.abs(brickGame.ballVY);
    }

    const hitBrick = brickGame.bricks.find(brick =>
        brick.alive &&
        brickGame.ballX + radius >= brick.x &&
        brickGame.ballX - radius <= brick.x + brick.width &&
        brickGame.ballY + radius >= brick.y &&
        brickGame.ballY - radius <= brick.y + brick.height
    );
    if (hitBrick) {
        hitBrick.alive = false;
        brickGame.score += (4 - hitBrick.row) * 10;
        brickGame.ballVY *= -1;
        if (brickGame.bricks.every(brick => !brick.alive)) {
            brickGame.state = 'won';
        }
    }

    if (brickGame.ballVY > 0 &&
        brickGame.ballY + radius >= paddleY &&
        brickGame.ballY - radius <= paddleY + 4 &&
        Math.abs(brickGame.ballX - brickGame.paddleX) <= 23) {
        const offset = (brickGame.ballX - brickGame.paddleX) / 23;
        brickGame.ballY = paddleY - radius;
        brickGame.ballVX = offset * 3.2;
        brickGame.ballVY = -Math.max(2.2, Math.abs(brickGame.ballVY));
    }

    if (brickGame.ballY > brickCanvas.height) {
        brickGame.lives--;
        if (brickGame.lives === 0) {
            brickGame.state = 'over';
        } else {
            brickGame.state = 'ready';
            brickGame.ballX = brickGame.paddleX;
            brickGame.ballY = brickCanvas.height - 25;
            brickGame.ballVX = 2.2;
            brickGame.ballVY = -2.6;
        }
    }

    drawBrickGame();
    if (brickGame.state === 'playing') {
        brickGame.frame = requestAnimationFrame(updateBrickGame);
    } else {
        brickGame.frame = 0;
    }
}

function drawBrickGame() {
    const context = brickCtx;
    const ink = $('screen').classList.contains('backlit') ? '#b5c3d8' : '#484647';
    const paddleY = brickCanvas.height - 15;
    context.clearRect(0, 0, brickCanvas.width, brickCanvas.height);
    context.fillStyle = ink;
    context.font = '8px monospace';
    context.textBaseline = 'top';
    context.fillText(`SCORE ${String(brickGame.score).padStart(4, '0')}`, 8, 5);
    context.textAlign = 'right';
    context.fillText(`BALLS ${brickGame.lives}`, brickCanvas.width - 8, 5);
    context.textAlign = 'left';
    context.fillRect(7, 16, brickCanvas.width - 14, 1);

    for (const brick of brickGame.bricks) {
        if (!brick.alive) continue;
        context.globalAlpha = 1 - brick.row * 0.12;
        context.fillRect(brick.x, brick.y, brick.width, brick.height);
        context.clearRect(brick.x + 2, brick.y + 2, brick.width - 4, 1);
    }
    context.globalAlpha = 1;
    context.fillRect(brickGame.paddleX - 20, paddleY, 40, 4);
    context.fillRect(Math.round(brickGame.ballX) - 2, Math.round(brickGame.ballY) - 2, 4, 4);

    let message = '';
    if (brickGame.state === 'ready') message = 'SELECT TO LAUNCH';
    else if (brickGame.state === 'paused') message = 'PAUSED';
    else if (brickGame.state === 'won') message = 'YOU WIN!';
    else if (brickGame.state === 'over') message = 'GAME OVER';
    if (message) {
        context.fillStyle = $('screen').classList.contains('backlit') ? '#b5c3d8' : '#484647';
        context.textAlign = 'center';
        context.font = 'bold 10px monospace';
        context.fillText(message, brickCanvas.width / 2, 91);
        context.font = '7px monospace';
        context.fillText('WHEEL TO MOVE', brickCanvas.width / 2, 105);
        context.textAlign = 'left';
    }
}

let resizePointerId = null;
let resizeStartX = 0, resizeStartY = 0, resizeStartScale = 1;
let resizeFrame = 0, pendingResizeScale = 1;
const UI_SCALE_MIN = 0.5;
const UI_SCALE_MAX = 1;
const ipodElement = document.querySelector('.ipod');

const _resizeHandle = document.getElementById('resize-handle');
if (_resizeHandle) _resizeHandle.addEventListener('pointerdown', e => {
    if (e.button !== 0 || resizePointerId !== null || !e.target.closest('.resize-hitbox')) return;
    e.preventDefault();
    e.stopPropagation();
    resizePointerId = e.pointerId;
    resizeStartX = e.screenX;
    resizeStartY = e.screenY;
    resizeStartScale = Number(getComputedStyle(ipodElement).getPropertyValue('--ui-scale')) || 1;
    _resizeHandle.setPointerCapture(e.pointerId);
    document.body.classList.add('is-resizing');
});

window.addEventListener('pointermove', e => {
    if (e.pointerId !== resizePointerId) return;
    const delta = (e.screenX - resizeStartX + e.screenY - resizeStartY) / 830;
    pendingResizeScale = Math.max(UI_SCALE_MIN, Math.min(UI_SCALE_MAX, resizeStartScale + delta));
    if (!resizeFrame) {
        resizeFrame = requestAnimationFrame(() => {
            resizeFrame = 0;
            ipodElement.style.setProperty('--ui-scale', pendingResizeScale.toFixed(3));
            send({ cmd: 'resize_window', scale: pendingResizeScale });
        });
    }
});

function endResize(e) {
    if (e.pointerId !== resizePointerId) return;
    if (resizeFrame) {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = 0;
        ipodElement.style.setProperty('--ui-scale', pendingResizeScale.toFixed(3));
    }
    send({ cmd: 'resize_window', scale: pendingResizeScale });
    send({ cmd: 'set_ui_scale', scale: pendingResizeScale });
    resizePointerId = null;
    document.body.classList.remove('is-resizing');
}
window.addEventListener('pointerup', endResize);
window.addEventListener('pointercancel', endResize);

    return { title: '', ...rows([]) };
}

// --- Navigation ---
function cur() { return stack[stack.length - 1]; }

function animateScreenTransition(direction) {
    const screenBody = document.querySelector('.screen-body');
    if (!screenBody) return;
    screenBody.classList.remove('slide-right', 'slide-left');
    void screenBody.offsetWidth;
    screenBody.classList.add(direction === 'left' ? 'slide-left' : 'slide-right');
}

function push(id) {
    let sel = 0;
    if (id === 'backlight') sel = Math.max(0, BACKLIGHT_LABELS.findIndex(([v]) => v === S.settings.backlight));
    if (id === 'theme_mode') sel = Math.max(0, THEME_MODE_LABELS.findIndex(([v]) => v === S.settings.theme_mode));
    if (id === 'shell') sel = Math.max(0, SHELL_LABELS.findIndex(([v]) => v === S.settings.shell));
    if (id === 'screen') sel = Math.max(0, SCREEN_LABELS.findIndex(([v]) => v === S.settings.screen));
    if (id === 'accent') sel = Math.max(0, ACCENT_LABELS.findIndex(([v]) => v === S.settings.accent));
    if (id === 'output') send({ cmd: 'refresh_outputs' });
    stack.push({ id, sel, top: 0 });
    
    const screenBody = document.querySelector('.screen-body');
    if (screenBody) {
        screenBody.classList.remove('slide-right', 'slide-left');
        void screenBody.offsetWidth;
        screenBody.classList.add('slide-right');
    }
    
    render();
}

function back() {
    if (view === 'alarm_ring') {
        dismissAlarm();
        return;
    }
    if (view === 'calendar') {
        view = 'menu';
        render();
        return;
    }
    if (view === 'brick') {
        cancelAnimationFrame(brickGame.frame);
        brickGame.frame = 0;
        view = 'menu';
        render();
        return;
    }
    if (view === 'now_playing') { 
        view = 'menu'; 
        const screenBody = document.querySelector('.screen-body');
        if (screenBody) {
            screenBody.classList.remove('slide-right', 'slide-left');
            void screenBody.offsetWidth;
            screenBody.classList.add('slide-left');
        }
        render(); 
        return; 
    }
    
    if (stack.length > 1) { 
        stack.pop();
        
        const screenBody = document.querySelector('.screen-body');
        if (screenBody) {
            screenBody.classList.remove('slide-right', 'slide-left');
            void screenBody.offsetWidth;
            screenBody.classList.add('slide-left');
        }
        
        render(); 
    }
}

function select() {
    if (view === 'alarm_ring') {
        dismissAlarm();
        return;
    }
    if (view === 'calendar') {
        calendarDate.setTime(Date.now());
        render();
        return;
    }
    if (view === 'brick') {
        selectBrickGame();
        return;
    }
    if (cur()?.id === 'alarm_time') {
        if (cur().sel < 2) {
            cur().sel = cur().sel === 0 ? 1 : 0;
            click();
            render();
        }
        return;
    }
    if (view === 'now_playing') {
        setMode(npMode === 'scrubbing' ? 'progress' : 'scrubbing');
        return;
    }
    const m = menu(cur().id);
    if (!m.count) return;
    const item = m.item(cur().sel);
    if (item.info) return;
    if (item.open) send({ cmd: 'open', context: item.open[0], name: item.open[1] });
    if (item.next) push(item.next);
    else if (item.act) { item.act(); render(); }
}

function rotate(steps) {
    if (!steps) return;
    if (view === 'alarm_ring') return;
    if (view === 'calendar') {
        calendarDate.setDate(calendarDate.getDate() + steps);
        render();
        return;
    }
    if (view === 'brick') {
        moveBrickPaddle(steps);
        return;
    }
    if (cur()?.id === 'alarm_time') {
        if (cur().sel < 2) adjustAlarmTime(steps);
        return;
    }
    if (view === 'now_playing') {
        if (npMode === 'scrubbing') scrub(steps); else changeVolume(steps);
        return;
    }
    if (cur().id === 'clicker_volume') {
        const volume = Math.max(0, Math.min(100, clickerVolume() + steps * 5));
        if (volume !== clickerVolume()) {
            setSettings({ clicker_volume: volume });
            click();
        }
        return;
    }
    const t = cur();
    const m = menu(t.id);
    
    const newSel = Math.max(0, Math.min(m.count - 1, t.sel + steps));
    
    if (newSel !== t.sel) {
        t.sel = newSel;
        click();
        render();
    }
}

function setSettings(patch) {
    S.settings = { ...S.settings, ...patch };
    send({ cmd: 'set_settings', settings: S.settings });
    wakeBacklight();
}

function playFrom(context, index) {
    send({ cmd: 'play', context, index });
    playedFrom = context;
    const t = lists[context].tracks[index];
    S.playback = { ...S.playback, status: 'playing', track: t, position_ms: 0 };
    receivedAt = performance.now();
    showNowPlaying();
}

function showNowPlaying() {
    view = 'now_playing';
    setMode('progress');

    const screenBody = document.querySelector('.screen-body');
    if (screenBody) {
        screenBody.classList.remove('slide-right', 'slide-left');
        void screenBody.offsetWidth;
        screenBody.classList.add('slide-right');
    }
    
    render();
}

// --- Rendering ---
function render() {
    try {
        applyTheme();
        const isReady = (S.phase === 'ready');
        const needsLogin = (S.phase === 'need_login');
        $('boot').style.display = isReady ? 'none' : 'flex';
        $('auth-error').style.display = needsLogin ? 'block' : 'none';

        const menuTitle = document.querySelector('.menu-title');
        if (menuTitle) {
            menuTitle.style.display = isReady ? 'block' : 'none';
        }
        
        $('now-playing').style.display = 'none';
        brickCanvas.style.display = 'none';
        calendarCanvas.style.display = 'none';
        $('alarm-ring-screen').style.display = 'none';
        const list = $('menu-list');
        
        renderTitleBar();
        if (view === 'now_playing') { renderNowPlaying(); return; }
        if (view === 'brick') { renderBrickView(); return; }
        if (view === 'calendar') { renderCalendarView(); return; }
        if (view === 'alarm_ring') { renderAlarmRingView(); return; }

        if (!isReady) {
            if (list) list.style.display = 'none';
            if (nowPlayingEl) nowPlayingEl.style.display = 'none';
            return;
        }
        
        if (!stack || stack.length === 0) {
            stack = [{ id: 'home', sel: 0, top: 0 }];
        }
        
        const t = cur();
        if (!t) return;
        
        const m = menu(t.id);
        setTitle(m.title);

        t.sel = Math.max(0, Math.min(t.sel, m.count - 1));
        if (t.sel < t.top) t.top = t.sel;
        if (t.sel >= t.top + ROWS) t.top = t.sel - ROWS + 1;
        t.top = Math.max(0, Math.min(t.top, m.count - ROWS));

        list.innerHTML = '';
        list.style.display = 'block';
        list.style.transform = 'none';
        list.style.opacity = '1';
        list.style.visibility = 'visible';

        for (let i = t.top; i < Math.min(m.count, t.top + ROWS); i++) {
            const item = m.item(i);
            const li = document.createElement('li');
            li.className = 'menu-item svelte-v01lnd' + (i === t.sel && !m.info && !item.info ? ' selected' : '');
            if (m.info || item.info) li.dataset.action = 'info';

            const title = document.createElement('span');
            title.className = 'item-title svelte-v01lnd';
            title.textContent = item.label;
            li.appendChild(title);

            if (item.value !== undefined) {
                const v = document.createElement('span');
                v.className = 'item-value svelte-v01lnd';
                v.textContent = item.value;
                li.appendChild(v);
            } else if (item.next) {
                const c = document.createElement('span');
                c.className = 'chevron svelte-v01lnd';
                li.appendChild(c);
            }

            li.addEventListener('click', () => { t.sel = i; select(); });
            list.appendChild(li);
        }

        // Next batch while scrolling.
        if (m.context) {
            const l = lists[m.context];
            if (l && !l.done && !l.requested && t.sel + PREFETCH >= l.tracks.length) {
                l.requested = true;
                send({ cmd: 'more', context: m.context });
            }
        }
    } catch (e) {
        //! ERROR? UNCOMMENT THIS TO SHOW IT ON THE SCREEN

        // $('title').textContent = "JS Error!";
        // const list = $('menu-list');
        // list.style.display = 'block';
        // list.style.transform = 'none';
        // list.innerHTML = `<li class="menu-item svelte-v01lnd selected"><span class="item-title svelte-v01lnd" style="font-size: 14px; white-space: normal;">${e.message}</span></li>`;
    }
}

function renderTitleBar() {

    ind.classList.toggle('pause', !playing);
    ind.innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
}

function fmt(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
}

function position() {
    const p = S.playback;
    const dur = p.track ? p.track.duration_ms : 0;
    if (scrubMs !== null) return scrubMs;
    const pos = p.position_ms + (p.status === 'playing' ? performance.now() - receivedAt : 0);
    return Math.min(pos, dur);
}

function volume() {
    return localVolume !== null ? localVolume : S.playback.volume;
}

let marqueeFor = null;
function renderNowPlaying() {
    const track = S.playback && S.playback.track ? S.playback.track : {};

    let trackName = track.name || "Unknown Track";
    if (trackName.startsWith('spotify:track:')) {
        trackName = "Loading...";
    }

    let artistName = track.artist || (track.artists ? track.artists.join(', ') : "Unknown Artist");
    if (artistName.startsWith('spotify:')) {
        artistName = "Spotify";
    }

    $('menu-list').style.display = 'none';
    $('now-playing').style.display = 'flex';
    setTitle('Now Playing');
    const p = S.playback;
    const t = p.track;
    if (!t) { back(); return; }

    // "n of m" when the track is from a list started here.
    const l = playedFrom && lists[playedFrom];
    const idx = l ? l.tracks.findIndex(x => x.uri === t.uri) : -1;
    $('np-index-row').hidden = false;
    $('np-index').textContent = idx >= 0 ? `${idx + 1} of ${l.total}` : '';
    $('np-modifiers').innerHTML = (S.settings.shuffle === 'songs' ? SHUFFLE_SVG : '') + (S.settings.repeat !== 'off' ? REPEAT_SVG : '');

    if (marqueeFor !== t.uri) {
        marqueeFor = t.uri;
        $('np-title').textContent = t.name;
        $('np-title-copy').textContent = t.name;
        $('np-artist').textContent = t.artist;
        $('np-album').textContent = t.album;
        updateMarquee();
    }
    renderProgress();
}

function updateMarquee() {
    const box = $('np-marquee'), title = $('np-title'), copy = $('np-title-copy');
    box.classList.remove('scrolling');
    copy.style.display = 'none';
    requestAnimationFrame(() => {
        const w = title.offsetWidth;
        if (w > box.clientWidth) {
            $('np-track').style.setProperty('--marquee-copy-width', w);
            copy.style.display = '';
            box.classList.add('scrolling');
        }
    });
}

function renderProgress() {
    const t = S.playback.track;
    if (!t) return;
    const dur = t.duration_ms || 1;
    const pos = position();
    $('np-fill').style.width = (pos / dur * 100) + '%';
    $('np-elapsed').textContent = fmt(pos);
    $('np-remaining').textContent = '-' + fmt(dur - pos);
    $('np-marker').style.left = (pos / dur * 100) + '%';
    $('np-scrub-elapsed').textContent = fmt(pos);
    $('np-scrub-remaining').textContent = '-' + fmt(dur - pos);
    $('np-volume-fill').style.width = volume() + '%';
}

function setMode(mode) {
    npMode = mode;
    $('np-progress').dataset.mode = mode;
    $('np-volume').classList.toggle('inactive', mode !== 'volume');
    $('np-scrub').classList.toggle('inactive', mode !== 'scrubbing');
    clearTimeout(npModeTimer);
    if (mode !== 'progress') npModeTimer = setTimeout(() => setMode('progress'), MODE_TIMEOUT);
    renderProgress();
}

// --- Volume / scrubbing: the bar moves at once, Spotify follows ---
function changeVolume(steps) {
    const v = Math.max(0, Math.min(100, volume() + steps * VOLUME_STEP));
    localVolume = v;
    localVolumeAt = performance.now();
    setMode('volume');
    send({ cmd: 'volume', value: v });
}

function scrub(steps) {
    const t = S.playback.track;
    if (!t) return;
    const step = Math.max(2000, t.duration_ms / 100);
    scrubMs = Math.max(0, Math.min(t.duration_ms, position() + steps * step));
    setMode('scrubbing');
    clearTimeout(scrubTimer);
    // Seek once the wheel rests.
    scrubTimer = setTimeout(() => {
        send({ cmd: 'seek', ms: Math.round(scrubMs) });
        S.playback = { ...S.playback, position_ms: scrubMs };
        receivedAt = performance.now();
        scrubSentAt = receivedAt;
        scrubMs = null;
    }, 250);
}

// --- Messages from Rust ---
function receive(msg) {
    if (msg.type === 'restart_for_update') {
        send({ cmd: 'quit' });
    } else if (msg.type === 'state') {
        const wasPhase = S.phase;
        const now = performance.now();
        // if (msg.status && msg.status !== S.status) showToast(msg.status);
        Object.assign(S, {
            phase: msg.phase, progress: msg.progress, status: msg.status,
            settings: msg.settings, about: msg.about, outputs: msg.outputs,
            update: msg.update ?? S.update,
        });
        S.ui_scale = Math.max(UI_SCALE_MIN, Math.min(UI_SCALE_MAX, msg.ui_scale ?? 1));
        if (resizePointerId === null) {
            ipodElement.style.setProperty('--ui-scale', S.ui_scale.toFixed(3));
        }
        const p = msg.playback;
        if (now - scrubSentAt < HOLD_REMOTE) p.position_ms = position();
        if (localVolume !== null && now - localVolumeAt < HOLD_REMOTE) p.volume = localVolume;
        else localVolume = null;
        S.playback = p;
        receivedAt = now;
        if (S.phase !== wasPhase) onPhase();
        wakeBacklightIfNeeded();
        render();
    } else if (msg.type === 'library') {
        S.playlists = msg.playlists;
        S.albums = msg.albums;
        S.liked = msg.liked;
        render();
    } else if (msg.type === 'list') {
        let l = lists[msg.context];
        if (msg.offset === 0 || !l) {
            l = lists[msg.context] = { name: msg.name, total: msg.total, tracks: [], done: false, requested: false };
        }
        if (msg.offset === l.tracks.length) l.tracks.push(...msg.tracks);
        l.name = msg.name;
        l.total = msg.total;
        l.done = msg.done;
        l.requested = false;
        render();
    }
}

function onPhase() {
    if (view === 'alarm_ring') stopAlarmTone();
    view = 'menu';
    alarmPausedBrick = false;
    if (S.phase === 'need_login') {
        stack = [{ id: 'login', sel: 0, top: 0 }];
        for (const k in lists) delete lists[k];
        playedFrom = null;
    }
    else if (S.phase === 'ready') stack = [{ id: 'home', sel: 0, top: 0 }];
}

function showToast(text) {
    if (S.phase !== 'ready') return;
    toast = text.replace(/^error: /, '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast = ''; render(); }, 3000);
}

// --- Backlight ---
let backlightTimer = null;
let lastSettingsBacklight = null;
function wakeBacklight() {
    const secs = BACKLIGHT_SECONDS[S.settings.backlight] ?? 0;
    const screen = $('screen');
    clearTimeout(backlightTimer);
    if (secs === 0) { screen.classList.remove('backlit'); return; }
    screen.classList.add('backlit');
    if (secs > 0) backlightTimer = setTimeout(() => screen.classList.remove('backlit'), secs * 1000);
}
function wakeBacklightIfNeeded() {
    if (S.settings.backlight !== lastSettingsBacklight) {
        lastSettingsBacklight = S.settings.backlight;
        wakeBacklight();
    }
}

// --- Clicker ---
const clickAudioTemplate = new Audio('asset://localhost/ipod_/ui_.mp3');
clickAudioTemplate.load();
let lastClickTime = 0;
const CLICK_COOLDOWN = 50;

// Web Audio based click sound (more reliable under WebKit autoplay policy).
let clickAudioCtx = null;
let clickAudioBuffer = null;
let clickAudioReady = false;
try {
    clickAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
} catch (_) { clickAudioCtx = null; }

async function loadClickSound() {
    if (!clickAudioCtx) return;
    try {
        const res = await fetch('asset://localhost/ipod_/ui_.mp3');
        const arr = await res.arrayBuffer();
        clickAudioBuffer = await new Promise((resolve, reject) => {
            clickAudioCtx.decodeAudioData(arr, resolve, reject);
        });
        clickAudioReady = true;
    } catch (e) {
        console.warn('click sound load failed', e);
    }
}
function unlockClickAudio() {
    if (clickAudioCtx && clickAudioCtx.state === 'suspended') {
        clickAudioCtx.resume().catch(() => {});
    }
}
window.addEventListener('pointerdown', unlockClickAudio, { passive: true });
window.addEventListener('keydown', unlockClickAudio, { passive: true });
loadClickSound();

function click(force = false) {
    if (!S.settings.clicker) return;

    const now = performance.now();
    if (!force && now - lastClickTime < CLICK_COOLDOWN) {
        return;
    }
    lastClickTime = now;

    // Prefer Web Audio (works after user gesture unlock).
    if (clickAudioCtx && clickAudioReady && clickAudioBuffer) {
        try {
            if (clickAudioCtx.state === 'suspended') clickAudioCtx.resume();
            const src = clickAudioCtx.createBufferSource();
            src.buffer = clickAudioBuffer;
            const gain = clickAudioCtx.createGain();
            gain.gain.value = clickerVolume() / 100;
            src.connect(gain);
            gain.connect(clickAudioCtx.destination);
            src.start(0);
            return;
        } catch (_) { /* fall through */ }
    }

    // Fallback to HTMLAudio.
    try {
        const sound = clickAudioTemplate.cloneNode();
        sound.currentTime = 0;
        sound.volume = clickerVolume() / 100;
        sound.play().catch(() => {});
    } catch (_) { /* no audio */ }
}

// --- Input ---
function input(fn) {
    return e => { e.preventDefault(); wakeBacklight(); if (S.phase === 'ready' || S.phase === 'need_login') fn(e); };
}

$('btn-select').addEventListener('click', input(() => { select(); }));
$('btn-menu').addEventListener('click', input(() => { back(); }));
$('btn-playpause').addEventListener('click', input(() => send({ cmd: 'play_pause' })));
$('btn-forward').addEventListener('click', input(() => send({ cmd: 'next' })));
$('btn-back').addEventListener('click', input(() => send({ cmd: 'prev' })));

// Click Wheel: drag around the ring.
const ring = $('ring');
let dragging = false, lastAngle = 0, acc = 0;
function angle(e) {
    const r = ring.getBoundingClientRect();
    const a = Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
    return a < 0 ? a + 360 : a;
}
ring.addEventListener('pointerdown', e => {
    dragging = true;
    ring.setPointerCapture(e.pointerId);
    lastAngle = angle(e);
    acc = 0;
    wakeBacklight();
});
ring.addEventListener('pointermove', e => {
    if (!dragging) return;
    const a = angle(e);
    let d = a - lastAngle;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    lastAngle = a;
    acc += d;
    const steps = Math.trunc(acc / STEP_DEG);
    if (steps) {
        acc -= steps * STEP_DEG;
        wakeBacklight();
        if (S.phase === 'ready' || S.phase === 'need_login') rotate(steps);
    }
});
const endDrag = () => { dragging = false; };
ring.addEventListener('pointerup', endDrag);
ring.addEventListener('pointercancel', endDrag);

// Mouse wheel / trackpad = rotation.
let wheelAcc = 0;
window.addEventListener('wheel', input(e => {
    wheelAcc += e.deltaY;
    const steps = Math.trunc(wheelAcc / 40);
    if (steps) { wheelAcc -= steps * 40; rotate(steps); }
}), { passive: false });

// Keyboard.
window.addEventListener('keydown', input(e => {
    switch (e.key) {
    case 'ArrowUp': 
        if (view === 'calendar') {
            calendarDate.setDate(calendarDate.getDate() - 7);
            render();
        } else if (view === 'menu' && cur()?.id === 'alarm_time') {
            adjustAlarmTime(-1);
        } else if (view === 'menu' && cur()) {
            const t = cur();
            if (t.sel > 0) {
                t.sel--;
                click();
                render();
            }
        }
        break;
    case 'ArrowDown': 
        if (view === 'calendar') {
            calendarDate.setDate(calendarDate.getDate() + 7);
            render();
        } else if (view === 'menu' && cur()?.id === 'alarm_time') {
            adjustAlarmTime(1);
        } else if (view === 'menu' && cur()) {
            const t = cur();
            const m = menu(t.id);
            if (t.sel < m.count - 1) {
                t.sel++;
                click();
                render();
            }
        }
        break;
    case 'Enter': ; select(); break;
    case 'Escape': case 'Backspace': back(); break;
    case ' ':
        if (view === 'alarm_ring') break;
        if (view === 'brick') select(); else send({ cmd: 'play_pause' });
        break;
    case 'ArrowLeft':
        if (view === 'alarm_ring') break;
        if (view === 'calendar') { calendarDate.setDate(calendarDate.getDate() - 1); render(); }
        else if (view === 'brick') moveBrickPaddle(-1);
        else if (view === 'menu' && cur()?.id === 'alarm_time') adjustAlarmTime(-1);
        else send({ cmd: 'prev' });
        break;
    case 'ArrowRight':
        if (view === 'alarm_ring') break;
        if (view === 'calendar') { calendarDate.setDate(calendarDate.getDate() + 1); render(); }
        else if (view === 'brick') moveBrickPaddle(1);
        else if (view === 'menu' && cur()?.id === 'alarm_time') adjustAlarmTime(1);
        else send({ cmd: 'next' });
        break;
    }
}));
document.addEventListener('contextmenu', e => e.preventDefault());

// Progress clock.
setInterval(() => {
    if (view === 'now_playing' && S.phase === 'ready') renderProgress();
}, 250);
setInterval(checkAlarm, 1000);

window.ipod = { receive };
