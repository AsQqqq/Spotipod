};
const lists = {};          // context -> { name, total, tracks, done, requested }
let receivedAt = performance.now();

// --- UI state ---
let stack = [];            // [{ id, sel, top }]
let view = 'menu';         // 'menu' | 'now_playing'
let npMode = 'progress';   // 'progress' | 'volume' | 'scrubbing'
let npModeTimer = null;
let playedFrom = null;     // context of the last track started here
let localVolume = null, localVolumeAt = -Infinity;
let scrubMs = null, scrubSentAt = -Infinity, scrubTimer = null;
let toastTimer = null, toast = '';

const $ = id => document.getElementById(id);
const send = msg => window.ipc && window.ipc.postMessage(JSON.stringify(msg));

// --- Menus ---
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

function rows(items) { return { count: items.length, item: i => items[i] }; }

document.getElementById('btn-close').addEventListener('click', () => {
    if (window.ipc && window.ipc.postMessage) {
        window.ipc.postMessage(JSON.stringify({ cmd: 'quit' }));
    }
});

document.getElementById('btn-minimize').addEventListener('click', () => {});

document.querySelector('.ipod-container').addEventListener('mousedown', (e) => {
    if (e.target.closest('button') || e.target.closest('.click-wheel') || e.target.closest('.ipod-screen') || e.target.closest('.window-controls')) {
        return;
    }
    
    if (window.ipc && window.ipc.postMessage) {
        window.ipc.postMessage(JSON.stringify({ cmd: 'drag_window' }));
    }
});

function menu(id) {
    const s = S.settings;
    switch (id) {
    case 'login':
        return { title: 'SpotiPod', ...rows([
            { label: 'Log In', act: () => send({ cmd: 'login' }) },
            ...(S.progress ? [{ label: S.progress, info: true }] : []),
        ]) };
    case 'home': {
        const items = [
            { label: 'Playlists', next: 'playlists' },
            { label: 'Albums', next: 'albums' },
            { label: 'Songs', next: S.liked ? 'list:' + S.liked : null, open: S.liked ? [S.liked, 'Songs'] : null },
            { label: 'Extras', next: 'extras' },
            { label: 'Settings', next: 'settings' },
        ];
        if (S.playback.track) items.push({ label: 'Now Playing', act: showNowPlaying });
        return { title: 'iPod', ...rows(items) };
    }
    case 'playlists':
        return { title: 'Playlists', ...rows(S.playlists.map(p => ({ label: p.name, next: 'list:' + p.uri, open: [p.uri, p.name] }))) };
    case 'albums':
        return { title: 'Albums', ...rows(S.albums.map(a => ({ label: a.name, next: 'list:' + a.uri, open: [a.uri, a.name] }))) };
    case 'settings':
        return { title: 'Settings', ...rows([
            { label: 'About', next: 'about' },
            { label: 'Shuffle', value: cap(s.shuffle), act: () => setSettings({ shuffle: s.shuffle === 'off' ? 'songs' : 'off' }) },
            { label: 'Repeat', value: cap(s.repeat), act: () => setSettings({ repeat: { off: 'one', one: 'all', all: 'off' }[s.repeat] }) },
            { label: 'Backlight Timer', next: 'backlight' },
            { label: 'Clicker', value: s.clicker ? 'On' : 'Off', act: () => setSettings({ clicker: !s.clicker }) },
            { label: 'Reset All Settings', next: 'reset' },
            { label: 'Log Out', next: 'logout' },
        ]) };
    case 'logout':
        return { title: 'Log Out', ...rows([
            { label: 'Cancel', act: back },
            { label: 'Log Out', act: () => {
                send({ cmd: 'logout' });
            } },
        ]) };
    case 'about': {
        const a = S.about;
        return { title: 'About', info: true, ...rows([
            { label: 'Songs', value: a ? String(a.songs) : '...' },
            { label: 'Company', value: a ? a.company : 'trade-cloud' },
            { label: 'Author', value: a ? a.author : 'AsQqqq' },
            { label: 'Version', value: a ? a.version : '' },
        ]) };
    }
    case 'backlight':
        return { title: 'Backlight Timer', ...rows(BACKLIGHT_LABELS.map(([v, label]) => ({
            label, act: () => { setSettings({ backlight: v }); back(); },
        }))) };
    case 'reset':
        return { title: 'Reset All', ...rows([
            { label: 'Cancel', act: back },
            { label: 'Reset', act: () => { send({ cmd: 'reset_settings' }); back(); } },
        ]) };
    case 'extras':
        return { title: 'Extras', ...rows([
            { label: 'Output', next: 'output' },
            { label: 'Log Out', next: 'logout' },
        ]) };
    case 'output':
        return { title: 'Output', ...rows(S.outputs.length
            ? S.outputs.map(o => ({ label: o.name, value: o.is_default ? '✓' : '', act: () => send({ cmd: 'set_output', id: o.id }) }))
            : [{ label: 'No devices', info: true }]) };
    case 'logout':
        return { title: 'Log Out', ...rows([
            { label: 'Cancel', act: back },
            { label: 'Yes, log out', act: () => {
                $('screen').style.visibility = 'hidden'; 
                setTimeout(() => {
                    send({ cmd: 'logout' });
                    $('screen').style.visibility = 'visible';
                }, 1500);
            } },
        ]) };
    }
    if (id.startsWith('list:')) {
        const context = id.slice(5);
        const l = lists[context];
        if (!l) return { title: 'Loading', ...rows([{ label: 'Loading...', info: true }]) };
        if (!l.tracks.length) return { title: l.name, ...rows([{ label: l.done ? 'No songs' : 'Loading...', info: true }]) };
        return {
            title: l.name,
            count: l.tracks.length,
            item: i => ({ label: l.tracks[i].name, act: () => playFrom(context, i) }),
            context,
        };
    }
    return { title: '', ...rows([]) };
}

// --- Navigation ---
function cur() { return stack[stack.length - 1]; }

function push(id) {
    let sel = 0;
    if (id === 'backlight') sel = Math.max(0, BACKLIGHT_LABELS.findIndex(([v]) => v === S.settings.backlight));
    if (id === 'output') send({ cmd: 'refresh_outputs' });
    stack.push({ id, sel, top: 0 });
    
    const screenBody = document.querySelector('.screen-body');
    if (screenBody) {
        screenBody.classList.remove('slide-right', 'slide-left');
        void screenBody.offsetWidth;
        screenBody.classList.add('slide-right');
    }
    
    render();
}

function back() {
    if (view === 'now_playing') { 
        view = 'menu'; 
        const screenBody = document.querySelector('.screen-body');
        if (screenBody) {
            screenBody.classList.remove('slide-right', 'slide-left');
            void screenBody.offsetWidth;
            screenBody.classList.add('slide-left');
        }
        render(); 
        return; 
    }
    
    if (stack.length > 1) { 
        stack.pop();
        
        const screenBody = document.querySelector('.screen-body');
        if (screenBody) {
            screenBody.classList.remove('slide-right', 'slide-left');
            void screenBody.offsetWidth;
            screenBody.classList.add('slide-left');
        }
        
        render(); 
    }
}

function select() {
    if (view === 'now_playing') {
        setMode(npMode === 'scrubbing' ? 'progress' : 'scrubbing');
        return;
    }
    const m = menu(cur().id);
    if (!m.count) return;
    const item = m.item(cur().sel);
    if (item.info) return;
    if (item.open) send({ cmd: 'open', context: item.open[0], name: item.open[1] });
    if (item.next) push(item.next);
    else if (item.act) { item.act(); render(); }
}

function rotate(steps) {
    if (!steps) return;
    if (view === 'now_playing') {
        if (npMode === 'scrubbing') scrub(steps); else changeVolume(steps);
        return;
    }
    const t = cur();
    const m = menu(t.id);
    
    const newSel = Math.max(0, Math.min(m.count - 1, t.sel + steps));
    
    if (newSel !== t.sel) {
        t.sel = newSel;
        click();
        render();
    }
}

function setSettings(patch) {
    S.settings = { ...S.settings, ...patch };
    send({ cmd: 'set_settings', settings: S.settings });
    wakeBacklight();
}

function playFrom(context, index) {
    send({ cmd: 'play', context, index });
    playedFrom = context;
    const t = lists[context].tracks[index];
    S.playback = { ...S.playback, status: 'playing', track: t, position_ms: 0 };
    receivedAt = performance.now();
    showNowPlaying();
}

function showNowPlaying() {
    view = 'now_playing';
    setMode('progress');

    const screenBody = document.querySelector('.screen-body');
    if (screenBody) {
        screenBody.classList.remove('slide-right', 'slide-left');
        void screenBody.offsetWidth;
        screenBody.classList.add('slide-right');
    }
    
    render();
}

// --- Rendering ---
function render() {
    try {
        const isReady = (S.phase === 'ready');
        const needsLogin = (S.phase === 'need_login');
        
        $('boot').style.display = isReady ? 'none' : 'flex';
        $('auth-error').style.display = needsLogin ? 'block' : 'none';

        const menuTitle = document.querySelector('.menu-title');
        if (menuTitle) {
            menuTitle.style.display = isReady ? 'block' : 'none';
        }
        
        $('now-playing').style.display = 'none';
        const list = $('menu-list');
        
        renderTitleBar();
        if (view === 'now_playing') { renderNowPlaying(); return; }

        if (!isReady) {
            if (list) list.style.display = 'none';
            if (nowPlayingEl) nowPlayingEl.style.display = 'none';
            return;
        }
        
        if (!stack || stack.length === 0) {
            stack = [{ id: 'home', sel: 0, top: 0 }];
        }
        
        const t = cur();
        if (!t) return;
        
        const m = menu(t.id);
        setTitle(m.title);

        t.sel = Math.max(0, Math.min(t.sel, m.count - 1));
        if (t.sel < t.top) t.top = t.sel;
        if (t.sel >= t.top + ROWS) t.top = t.sel - ROWS + 1;
        t.top = Math.max(0, Math.min(t.top, m.count - ROWS));

        list.innerHTML = '';
        list.style.display = 'block';
        list.style.transform = 'none';
        list.style.opacity = '1';
        list.style.visibility = 'visible';

        for (let i = t.top; i < Math.min(m.count, t.top + ROWS); i++) {
            const item = m.item(i);
            const li = document.createElement('li');
            li.className = 'menu-item svelte-v01lnd' + (i === t.sel && !m.info && !item.info ? ' selected' : '');
            if (m.info || item.info) li.dataset.action = 'info';

            const title = document.createElement('span');
            title.className = 'item-title svelte-v01lnd';
            title.textContent = item.label;
            li.appendChild(title);

            if (item.value !== undefined) {
                const v = document.createElement('span');
                v.className = 'item-value svelte-v01lnd';
                v.textContent = item.value;
                li.appendChild(v);
            } else if (item.next) {
                const c = document.createElement('span');
                c.className = 'chevron svelte-v01lnd';
                li.appendChild(c);
            }

            li.addEventListener('click', () => { t.sel = i; select(); });
            list.appendChild(li);
        }
    } catch (e) {
        //! ERROR? UNCOMMENT THIS TO SHOW IT ON THE SCREEN

        // $('title').textContent = "JS Error!";
        // const list = $('menu-list');
        // list.style.display = 'block';
        // list.style.transform = 'none';
        // list.innerHTML = `<li class="menu-item svelte-v01lnd selected"><span class="item-title svelte-v01lnd" style="font-size: 14px; white-space: normal;">${e.message}</span></li>`;
    }
}

function setTitle(text) {
    try {
        const el = $('title');
        el.classList.toggle('toast', !!toast);
        if (!toast && text === 'iPod') {
            el.innerHTML = '<img src="asset://localhost/assets/spotipod.svg" alt="SpotiPod" style="height: 20px; vertical-align: middle;">';
        } else {
            el.textContent = toast || text;
        }
    } catch (e) {
        $('title').textContent = "Title Error";
    }
}

function renderTitleBar() {
    const ind = $('play-indicator');
    const st = S.playback.status;
    const playing = st === 'playing' || st === 'loading';
    ind.style.display = S.playback.track && (playing || st === 'paused') ? 'block' : 'none';
    ind.classList.toggle('pause', !playing);
    ind.innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
}

function fmt(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
}

function position() {
    const p = S.playback;
    const dur = p.track ? p.track.duration_ms : 0;
    if (scrubMs !== null) return scrubMs;
    const pos = p.position_ms + (p.status === 'playing' ? performance.now() - receivedAt : 0);
    return Math.min(pos, dur);
}

function volume() {
    return localVolume !== null ? localVolume : S.playback.volume;
}

let marqueeFor = null;
function renderNowPlaying() {
    const track = S.playback && S.playback.track ? S.playback.track : {};

    let trackName = track.name || "Unknown Track";
    if (trackName.startsWith('spotify:track:')) {
        trackName = "Loading...";
    }

    let artistName = track.artist || (track.artists ? track.artists.join(', ') : "Unknown Artist");
    if (artistName.startsWith('spotify:')) {
        artistName = "Spotify";
    }

    $('menu-list').style.display = 'none';
    $('now-playing').style.display = 'flex';
    setTitle('Now Playing');
    const p = S.playback;
    const t = p.track;
    if (!t) { back(); return; }

    // "n of m" when the track is from a list started here.
    const l = playedFrom && lists[playedFrom];
    const idx = l ? l.tracks.findIndex(x => x.uri === t.uri) : -1;
    $('np-index-row').hidden = false;
    $('np-index').textContent = idx >= 0 ? `${idx + 1} of ${l.total}` : '';
    $('np-modifiers').innerHTML = (S.settings.shuffle === 'songs' ? SHUFFLE_SVG : '') + (S.settings.repeat !== 'off' ? REPEAT_SVG : '');

    if (marqueeFor !== t.uri) {
        marqueeFor = t.uri;
        $('np-title').textContent = t.name;
        $('np-title-copy').textContent = t.name;
        $('np-artist').textContent = t.artist;
        $('np-album').textContent = t.album;
        updateMarquee();
    }
    renderProgress();
}

function updateMarquee() {
    const box = $('np-marquee'), title = $('np-title'), copy = $('np-title-copy');
    box.classList.remove('scrolling');
    copy.style.display = 'none';
    requestAnimationFrame(() => {
        const w = title.offsetWidth;
        if (w > box.clientWidth) {
            $('np-track').style.setProperty('--marquee-copy-width', w);
            copy.style.display = '';
            box.classList.add('scrolling');
        }
    });
}

function renderProgress() {
    const t = S.playback.track;
    if (!t) return;
    const dur = t.duration_ms || 1;
    const pos = position();
    $('np-fill').style.width = (pos / dur * 100) + '%';
    $('np-elapsed').textContent = fmt(pos);
    $('np-remaining').textContent = '-' + fmt(dur - pos);
    $('np-marker').style.left = (pos / dur * 100) + '%';
    $('np-scrub-elapsed').textContent = fmt(pos);
    $('np-scrub-remaining').textContent = '-' + fmt(dur - pos);
    $('np-volume-fill').style.width = volume() + '%';
}

function setMode(mode) {
    npMode = mode;
    $('np-progress').dataset.mode = mode;
    $('np-volume').classList.toggle('inactive', mode !== 'volume');
    $('np-scrub').classList.toggle('inactive', mode !== 'scrubbing');
    clearTimeout(npModeTimer);
    if (mode !== 'progress') npModeTimer = setTimeout(() => setMode('progress'), MODE_TIMEOUT);
    renderProgress();
}

// --- Volume / scrubbing: the bar moves at once, Spotify follows ---
function changeVolume(steps) {
    const v = Math.max(0, Math.min(100, volume() + steps * VOLUME_STEP));
    localVolume = v;
    localVolumeAt = performance.now();
    setMode('volume');
    send({ cmd: 'volume', value: v });
}

function scrub(steps) {
    const t = S.playback.track;
    if (!t) return;
    const step = Math.max(2000, t.duration_ms / 100);
    scrubMs = Math.max(0, Math.min(t.duration_ms, position() + steps * step));
    setMode('scrubbing');
    clearTimeout(scrubTimer);
    // Seek once the wheel rests.
    scrubTimer = setTimeout(() => {
        send({ cmd: 'seek', ms: Math.round(scrubMs) });
        S.playback = { ...S.playback, position_ms: scrubMs };
        receivedAt = performance.now();
        scrubSentAt = receivedAt;
        scrubMs = null;
    }, 250);
}

// --- Messages from Rust ---
function receive(msg) {
    if (msg.type === 'state') {
        const wasPhase = S.phase;
        const now = performance.now();
        // if (msg.status && msg.status !== S.status) showToast(msg.status);
        Object.assign(S, {
            phase: msg.phase, progress: msg.progress, status: msg.status,
            settings: msg.settings, about: msg.about, outputs: msg.outputs,
        });
        const p = msg.playback;
        if (now - scrubSentAt < HOLD_REMOTE) p.position_ms = position();
        if (localVolume !== null && now - localVolumeAt < HOLD_REMOTE) p.volume = localVolume;
        else localVolume = null;
        S.playback = p;
        receivedAt = now;
        if (S.phase !== wasPhase) onPhase();
        wakeBacklightIfNeeded();
        render();
    } else if (msg.type === 'library') {
        S.playlists = msg.playlists;
        S.albums = msg.albums;
        S.liked = msg.liked;
        render();
    } else if (msg.type === 'list') {
        let l = lists[msg.context];
        if (msg.offset === 0 || !l) {
            l = lists[msg.context] = { name: msg.name, total: msg.total, tracks: [], done: false, requested: false };
        }
        if (msg.offset === l.tracks.length) l.tracks.push(...msg.tracks);
        l.name = msg.name;
        l.total = msg.total;
        l.done = msg.done;
        l.requested = false;
        render();
    }
}

function onPhase() {
    view = 'menu';
    if (S.phase === 'need_login') {
        stack = [{ id: 'login', sel: 0, top: 0 }];
        for (const k in lists) delete lists[k];
        playedFrom = null;
    }
    else if (S.phase === 'ready') stack = [{ id: 'home', sel: 0, top: 0 }];
}

function showToast(text) {
    if (S.phase !== 'ready') return;
    toast = text.replace(/^error: /, '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast = ''; render(); }, 3000);
}

// --- Backlight ---
let backlightTimer = null;
let lastSettingsBacklight = null;
function wakeBacklight() {
    const secs = BACKLIGHT_SECONDS[S.settings.backlight] ?? 0;
    const screen = $('screen');
    clearTimeout(backlightTimer);
    if (secs === 0) { screen.classList.remove('backlit'); return; }
    screen.classList.add('backlit');
    if (secs > 0) backlightTimer = setTimeout(() => screen.classList.remove('backlit'), secs * 1000);
}
function wakeBacklightIfNeeded() {
    if (S.settings.backlight !== lastSettingsBacklight) {
        lastSettingsBacklight = S.settings.backlight;
        wakeBacklight();
    }
}

// --- Clicker ---
const clickAudioTemplate = new Audio('asset://localhost/ipod_/ui_.mp3');
clickAudioTemplate.load();
let lastClickTime = 0;
const CLICK_COOLDOWN = 50;

function click() {
    if (!S.settings.clicker) return;
    
    const now = performance.now();
    if (now - lastClickTime < CLICK_COOLDOWN) {
        return;
    }
    lastClickTime = now;

    try {
        const sound = clickAudioTemplate.cloneNode();
        sound.currentTime = 0;
        sound.play().catch(() => {});
    } catch (_) { /* no audio */ }
}

// --- Input ---
function input(fn) {
    return e => { e.preventDefault(); wakeBacklight(); if (S.phase === 'ready' || S.phase === 'need_login') fn(e); };
}

$('btn-select').addEventListener('click', input(() => { select(); }));
$('btn-menu').addEventListener('click', input(() => { back(); }));
$('btn-playpause').addEventListener('click', input(() => send({ cmd: 'play_pause' })));
$('btn-forward').addEventListener('click', input(() => send({ cmd: 'next' })));
$('btn-back').addEventListener('click', input(() => send({ cmd: 'prev' })));

// Click Wheel: drag around the ring.
const ring = $('ring');
let dragging = false, lastAngle = 0, acc = 0;
function angle(e) {
    const r = ring.getBoundingClientRect();
    const a = Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
    return a < 0 ? a + 360 : a;
}
ring.addEventListener('pointerdown', e => {
    dragging = true;
    ring.setPointerCapture(e.pointerId);
    lastAngle = angle(e);
    acc = 0;
    wakeBacklight();
});
ring.addEventListener('pointermove', e => {
    if (!dragging) return;
    const a = angle(e);
    let d = a - lastAngle;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    lastAngle = a;
    acc += d;
    const steps = Math.trunc(acc / STEP_DEG);
    if (steps) {
        acc -= steps * STEP_DEG;
        wakeBacklight();
        if (S.phase === 'ready' || S.phase === 'need_login') rotate(steps);
    }
});
const endDrag = () => { dragging = false; };
ring.addEventListener('pointerup', endDrag);
ring.addEventListener('pointercancel', endDrag);

// Mouse wheel / trackpad = rotation.
let wheelAcc = 0;
window.addEventListener('wheel', input(e => {
    wheelAcc += e.deltaY;
    const steps = Math.trunc(wheelAcc / 40);
    if (steps) { wheelAcc -= steps * 40; rotate(steps); }
}), { passive: false });

// Keyboard.
window.addEventListener('keydown', input(e => {
    switch (e.key) {
    case 'ArrowUp': 
        if (view === 'menu' && cur()) {
            const t = cur();
            if (t.sel > 0) {
                t.sel--;
                click();
                render();
            }
        }
        break;
    case 'ArrowDown': 
        if (view === 'menu' && cur()) {
            const t = cur();
            const m = menu(t.id);
            if (t.sel < m.count - 1) {
                t.sel++;
                click();
                render();
            }
        }
        break;
    case 'Enter': ; select(); break;
    case 'Escape': case 'Backspace': back(); break;
    case ' ': send({ cmd: 'play_pause' }); break;
    case 'ArrowLeft': send({ cmd: 'prev' }); break;
    case 'ArrowRight': send({ cmd: 'next' }); break;
    }
}));
document.addEventListener('contextmenu', e => e.preventDefault());

// Progress clock.
setInterval(() => {
    if (view === 'now_playing' && S.phase === 'ready') renderProgress();
}, 250);

window.ipod = { receive };
render();
send({ cmd: 'ready' });
</script>
