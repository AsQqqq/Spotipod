name: Build and draft release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.config.outputs.version }}
      matrix: ${{ steps.config.outputs.matrix }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version and build platforms
        id: config
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import tomllib
          from pathlib import Path

          with Path("Cargo.toml").open("rb") as file:
              version = tomllib.load(file)["workspace"]["package"]["version"]
          with Path("release.toml").open("rb") as file:
              platforms = tomllib.load(file)["platforms"]

          runners = {
              "macos": {
                  "os": "macos-15",
                  "target": "x86_64-apple-darwin,aarch64-apple-darwin",
                  "asset_suffix": "macOS-universal.zip",
              },
              "windows": {
                  "os": "windows-latest",
                  "target": "x86_64-pc-windows-msvc",
                  "asset_suffix": "windows-x64.zip",
              },
              "linux": {
                  "os": "ubuntu-22.04",
                  "target": "x86_64-unknown-linux-gnu",
                  "asset_suffix": "linux-x64.tar.gz",
              },
          }
          matrix = [
              {"platform": platform, **runner}
              for platform, runner in runners.items()
              if platforms.get(platform) is True
          ]
          if not matrix:
              raise SystemExit("Enable at least one platform in release.toml")

          print(f"version={version}")
          print("matrix=" + json.dumps({"include": matrix}, separators=(",", ":")))
          PY

      - name: Skip if this version is already the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.config.outputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases can only be built from main." >&2
            exit 1
          fi

          latest_tag="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // ""')"
          latest_version="${latest_tag#v}"

          if [[ "$latest_version" == "$VERSION" ]]; then
            echo "Version $VERSION is already the latest release; skipping build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    # Caps a hung build; queue time is not counted.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux webview dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build universal macOS binary
        if: matrix.platform == 'macos'
        env:
          TARGETS: ${{ matrix.target }}
        run: |
          IFS=',' read -r intel_target arm_target <<< "$TARGETS"
          rustup target add "$intel_target" "$arm_target"
          cargo build --locked --release -p spotipod-gui --target "$intel_target"
          cargo build --locked --release -p spotipod-gui --target "$arm_target"

      - name: Build Windows or Linux binary
        if: matrix.platform != 'macos'
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release -p spotipod-gui --target "$TARGET"

      - name: Package macOS universal binary
        if: matrix.platform == 'macos'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          lipo -create \
            target/x86_64-apple-darwin/release/spotipod-gui \
            target/aarch64-apple-darwin/release/spotipod-gui \
            -output dist/spotipod-gui

          app="dist/SpotiPod.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          mv dist/spotipod-gui "$app/Contents/MacOS/spotipod-gui"
          chmod 755 "$app/Contents/MacOS/spotipod-gui"

          mkdir -p dist/SpotiPod.iconset
          cp assets/icon/mac-16.png dist/SpotiPod.iconset/icon_16x16.png
          cp assets/icon/mac-32.png dist/SpotiPod.iconset/icon_16x16@2x.png
          cp assets/icon/mac-32.png dist/SpotiPod.iconset/icon_32x32.png
          cp assets/icon/mac-64.png dist/SpotiPod.iconset/icon_32x32@2x.png
          cp assets/icon/mac-128.png dist/SpotiPod.iconset/icon_128x128.png
          cp assets/icon/mac-256.png dist/SpotiPod.iconset/icon_128x128@2x.png
          cp assets/icon/mac-256.png dist/SpotiPod.iconset/icon_256x256.png
          cp assets/icon/mac-512.png dist/SpotiPod.iconset/icon_256x256@2x.png
          cp assets/icon/mac-512.png dist/SpotiPod.iconset/icon_512x512.png
          cp assets/icon/mac-1024.png dist/SpotiPod.iconset/icon_512x512@2x.png
          iconutil --convert icns --output "$app/Contents/Resources/SpotiPod.icns" dist/SpotiPod.iconset

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>spotipod-gui</string>
            <key>CFBundleIconFile</key>
            <string>SpotiPod</string>
            <key>CFBundleIdentifier</key>
            <string>org.spotipod.Spotipod</string>
            <key>CFBundleName</key>
            <string>SpotiPod</string>
            <key>CFBundleDisplayName</key>
            <string>SpotiPod</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.music</string>
            <key>NSHumanReadableCopyright</key>
            <string>Copyright © 2026 trade-cloud. PolyForm Noncommercial 1.0.0.</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          ditto -c -k --norsrc --keepParent "$app" \
            "dist/SpotiPod-${VERSION}-macOS-universal.zip"

      - name: Build macOS DMG installer
        if: matrix.platform == 'macos'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          SPOTIPOD_DMG_OUT="dist/SpotiPod-${VERSION}-macOS-universal.dmg" \
            sh scripts/build-macos-dmg.sh

      - name: Package Windows binary
        if: matrix.platform == 'windows'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/$env:TARGET/release/spotipod-gui.exe" dist/
          Compress-Archive -Path dist/spotipod-gui.exe `
            -DestinationPath "dist/SpotiPod-${env:VERSION}-windows-x64.zip"

      - name: Package Linux binary
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/${TARGET}/release/spotipod-gui" dist/
          tar -C dist -czf "dist/SpotiPod-${VERSION}-linux-x64.tar.gz" spotipod-gui

      - uses: actions/upload-artifact@v4
        with:
          name: SpotiPod-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: dist/SpotiPod-${{ needs.prepare.outputs.version }}-*
          if-no-files-found: error

  draft-release:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create version tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$VERSION" dist/SpotiPod-* \
            --draft \
            --title "SpotiPod $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
