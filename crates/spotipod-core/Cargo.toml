[package]
name = "spotipod-core"
description = "SpotiPod core: auth, Spotify Connect remote control, library, system audio output"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
librespot.workspace = true
tokio.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
log.workspace = true
directories.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
protobuf = "3.7"
protobuf-json-mapping = "3.7"
http = "1"
bytes = "1"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }

[build-dependencies]
protobuf-codegen = "3.7"
